<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Игры">
<meta name="description" content="Дурак, Pac-Man, Косынка, Паук и Змейка в одном приложении">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Игры</title>
<style>
/* ============ ЕДИНАЯ ТЕМА ============ */
:root{
  --bg:#0d1218;--panel:#171f29;--panel2:#202b38;--ink:#f1f5f9;--mut:#b9c5d1;--line:#33445a;
  --acc:#ffcf3e;--grn:#2fb872;--red:#ef5350;--blu:#4aa3ff;--pur:#a78bfa;
  --r:14px;--r-s:10px;--sh:0 6px 18px #0007;--sh-s:0 2px 6px #0006;
  --btn:48px;--vh:100dvh;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
#app{position:fixed;left:0;right:0;top:0;height:var(--vh,100dvh);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:relative;height:100%;display:flex;flex-direction:column;touch-action:manipulation;background:var(--tone,var(--bg))}
button{font:inherit;color:inherit}
.noselect,.stage,.bar{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* ---- верхняя панель игры ---- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0009;min-height:56px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bar .ttl{font-size:18px;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 14px;border:0;border-radius:var(--r-s);background:#ffffff22;color:var(--ink);font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none}
.bt:active{background:#ffffff40}
.bt.off{opacity:.55}
.bt.hl{background:var(--acc);color:#222;animation:hl 1s infinite alternate}
@keyframes hl{to{transform:scale(1.05)}}
/* круглые иконки шапки: 44x44, у каждой свой цвет */
.ib{position:relative;flex:0 0 auto;width:44px;height:44px;padding:0;border:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:var(--c,#3b5bdb);box-shadow:var(--sh-s)}
.ib svg{width:24px;height:24px;display:block}
.ib::after{content:"";position:absolute;right:3px;bottom:3px;width:11px;height:11px;border-radius:50%;background:#35d07f;border:2px solid #0d1218}
.ib.nodot::after{display:none}
.ib.off{background:#46505c;color:#aab4be;box-shadow:none}
.ib.off::after{background:#ef5350}
.ib:active{filter:brightness(.82)}
.ib.snd{--c:#2f6bff}.ib.vib{--c:#8b5cf6}.ib.pause{--c:#f59e0b;color:#1c1408}
.ib.menu{--c:#2c3a4b;width:auto;padding:0 14px;gap:6px;font-weight:700;font-size:15px}
.stage{flex:1;min-height:0;position:relative;width:100%;margin:0 auto;overflow:hidden}
.board{touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
/* ---- панели поверх игры (старт / пауза / конец) ---- */
.ov{position:absolute;inset:0;z-index:40;display:flex;pointer-events:none}
.ov.top{align-items:flex-start;justify-content:center;padding:10px}
.ov.center{align-items:center;justify-content:center;padding:12px}
.ov.dim{background:#000b;pointer-events:auto}
.ov .panel{pointer-events:auto;background:#141c26ee;border:1px solid #ffffff30;border-radius:18px;padding:16px 16px 14px;width:min(100%,380px);text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--sh);max-height:100%;overflow:auto;animation:pop .22s ease-out}
.ov h3{margin:0 0 8px;font-size:22px}
.ov .ln{font-size:16px;color:#e3eaf1;margin:4px 0}
.ov .ln b{color:var(--acc)}
.ov .hint{font-size:15px;color:var(--mut);margin:4px 0 10px}
.ov .opt{display:flex;gap:8px;margin:4px 0 10px}
.ov .opt .lb{font-size:14px;color:var(--mut);text-align:left;margin-top:6px}
.ov .opt button{flex:1;min-height:46px;padding:8px 6px;border-radius:12px;border:2px solid #ffffff30;background:#ffffff14;font-size:15px;font-weight:700;cursor:pointer}
.ov .opt button.on{background:var(--grn);border-color:#ffffffb0;color:#fff}
.pb{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pbtn{flex:1;max-width:200px;min-height:48px;padding:10px 12px;border:0;border-radius:var(--r);font-size:17px;font-weight:800;background:#ffffff2b;cursor:pointer}
.pbtn.main{background:var(--acc);color:#1c1c1c;animation:pulse 1.8s ease-in-out infinite}
.pbtn:active{filter:brightness(.85)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
/* ---- экранные кнопки направлений ---- */
.dpad{position:absolute;right:10px;bottom:10px;width:146px;height:146px;z-index:30;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;opacity:.82}
.dpad button{min-width:44px;min-height:44px;border:0;border-radius:14px;background:#ffffff3a;font-size:22px;cursor:pointer;touch-action:none;color:#fff}
.dpad button:active{background:#ffffff77}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
/* ---- меню ---- */
#s-menu,#s-stats{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom;--tone:radial-gradient(ellipse at 50% 0,#1b2a3d,#0d1218 70%)}
.wrapm{width:100%;max-width:640px;margin:0 auto;padding:18px 16px 32px}
.wrapm h1{margin:6px 0 4px;font-size:32px}
.wrapm .sub{color:var(--mut);font-size:15px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:3px;padding:14px 14px 14px;border-radius:20px;text-decoration:none;color:#fff;min-height:128px;box-shadow:var(--sh);overflow:hidden;transition:transform .12s}
.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:104px}
.tile .ic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:#ffffff26;font-size:30px;line-height:1;margin-bottom:6px}
.tile b{font-size:20px}
.tile small{font-size:14px;opacity:.95}
.tile .cont{position:absolute;right:10px;top:10px;background:#000b;border-radius:10px;padding:3px 9px;font-size:14px;font-weight:700}
.tile:active{transform:scale(.97)}
.rowm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rowm .bt{min-height:52px;font-size:15px;min-width:0;justify-content:space-between}
.tg .pill{font-style:normal;font-size:14px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--grn);color:#06210f}
.tg.off{opacity:1}.tg.off .pill{background:#59636e;color:#e5eaee}
.card-s{background:var(--panel);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card-s h3{margin:0 0 6px;font-size:18px}
.card-s div{font-size:15px;color:#dbe3ea;margin:3px 0}
.card-s b{color:var(--acc)}
/* ---- общие подписи и счётчики игр ---- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;font-weight:800;flex:0 0 auto;background:#0006}
.hbox{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
.hbox small{font-size:14px;font-weight:700;letter-spacing:.5px;opacity:.85}
.hbox b{font-size:24px;font-variant-numeric:tabular-nums}
.hbox b.new{color:#fff;text-shadow:0 0 8px currentColor}
.lives{display:flex;gap:4px;min-height:28px;align-items:center}
.lives .life{width:24px;height:24px}
.fruits{font-size:22px;white-space:nowrap}
/* ================= ДУРАК ================= */
.s-durak{--tone:radial-gradient(ellipse at 50% 40%,#2c6b3f 0,#215a33 55%,#173f25 100%)}
.s-durak .stage{--cw:clamp(44px,min(17vw,10.8vh),86px);--tcw:var(--cw)}
.dk{position:absolute;inset:0;margin:0 auto;max-width:1000px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;padding:6px 10px 8px;overflow:hidden}
.dk-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px;padding:0 2px;min-height:44px}
.dk-top .bt{min-height:44px;font-size:14px;padding:0 12px;background:#00000040}
.dk-opps{display:flex;justify-content:center;gap:8px}
.dk-opp{flex:1;min-width:0;text-align:center;border-radius:12px;padding:2px 2px 4px;transition:background .2s}
.dk-opp.act{background:#ffffff22;box-shadow:0 0 0 2px #e8c35a99}
.dk-opp.gone{opacity:.5}
.dk-olab{font-size:14px;font-weight:600;margin-top:2px;text-shadow:0 1px 2px #000a}
.dk-hand{display:flex;justify-content:center;min-height:calc(var(--cw)*.62);padding-top:4px}
.dk-hand .card{margin-left:calc(var(--cw)*-.42);width:calc(var(--cw)*.66);height:calc(var(--cw)*.62);overflow:hidden}
.dk-hand .card:first-child{margin-left:0}
.dk-opps.n1 .dk-hand .card{width:calc(var(--cw)*.8);height:calc(var(--cw)*.74);margin-left:calc(var(--cw)*-.5)}
.dk-opps.n1 .dk-hand .card:first-child{margin-left:0}
.dk-mid{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;min-height:0}
.dk-side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:calc(var(--cw)*1.35)}
#dk-deck{position:relative;width:calc(var(--cw)*1.3);height:calc(var(--cw)*1.35)}
#dk-deck .card{position:absolute;left:0;top:0}
#dk-deck .trumpcard{transform:rotate(90deg) translate(18%,-30%);left:10px;top:4px}
.dk-trumpsuit{font-size:44px;line-height:calc(var(--cw)*1.35);text-align:center}.dk-trumpsuit.red{color:#ff8a80}
#dk-trump{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#00000040;border-radius:12px;padding:3px 8px;width:calc(var(--cw)*1.35);min-width:84px;text-align:center;line-height:1.15}
#dk-trump .lb{font-size:14px;font-weight:600;opacity:.9}
#dk-trump .row{display:flex;align-items:center;gap:4px}
#dk-trump .su{font-size:24px;line-height:1;font-weight:800}
#dk-trump .su.red{color:#ff8a80}
#dk-trump b{font-size:14px}
#dk-deck .dkn{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);z-index:3;background:#000c;color:#fff;font-size:14px;font-weight:800;border-radius:99px;padding:0 9px;min-width:28px;text-align:center;border:1px solid #ffffff55}
#dk-disc{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:calc(var(--cw)*1.05);padding:5px 8px 6px;border-radius:12px;background:#00000030;border:2px dashed #ffffff40}
#dk-disc .pile{position:relative;width:calc(var(--cw)*.62);height:calc(var(--cw)*.78)}
#dk-disc .pile .card{position:absolute;left:0;top:0;width:calc(var(--cw)*.62);height:calc(var(--cw)*.78);transform:rotate(var(--r,0deg));animation:none}
#dk-disc .pile.empty{border-radius:9px;border:2px dashed #ffffff30}
#dk-disc .lab{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#dk-disc .lab i{font-style:normal;background:#000b;border-radius:99px;padding:0 8px;min-width:26px;text-align:center}
#dk-table{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;align-content:center;align-items:flex-start;min-height:0;height:100%;overflow:visible}
.pair{--cw:var(--tcw);position:relative;flex:0 0 auto;width:calc(var(--tcw)*1.32);height:calc(var(--tcw)*1.86)}
.pair .card{position:absolute;left:0;top:calc(var(--tcw)*.06)}
.pair .def{left:calc(var(--tcw)*.3);top:calc(var(--tcw)*.3);transform:rotate(9deg);animation:dkpop .25s}
.pair.sel .card:first-child{outline:3px solid var(--acc)}
.card{width:var(--cw);height:calc(var(--cw)*1.4);background:#fbfaf6;color:#0b0b0b;border-radius:9px;box-shadow:0 2px 6px #0007,0 0 0 1px #0002 inset;position:relative;font-weight:700;animation:dkpop .22s;transition:transform .12s;flex:0 0 auto}
.card.red{color:#c62828}
.card b{position:absolute;left:5px;top:3px;font-size:calc(var(--cw)*.26);line-height:1;text-align:center}
.card b i{display:block;font-style:normal;font-size:calc(var(--cw)*.24)}
.card b.br{left:auto;right:5px;top:auto;bottom:3px;transform:rotate(180deg)}
.card span.face{position:absolute;left:23%;right:23%;top:9%;bottom:9%;display:block}
.card span.face svg{width:100%;height:100%;display:block}
.card.back{background:var(--backimg,repeating-linear-gradient(45deg,#2b4f9b 0 6px,#35609f 6px 12px));border:3px solid #fbfaf6}
.card.ok{transform:translateY(-10px);box-shadow:0 4px 10px #0009,0 0 0 2px var(--acc)}
.card.no{filter:brightness(.72)}
.card.dealin{animation:dkdeal .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--dl,0s)}
@keyframes dkpop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes dkdeal{from{transform:translate(-38vw,-34vh) rotate(-30deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.sweep{position:fixed;z-index:80;pointer-events:none;will-change:transform,opacity;transition:transform .5s cubic-bezier(.5,0,.8,.4),opacity .5s ease-in}
.dk-log{font-size:14px;line-height:1.35;color:#fff;min-height:calc(1.35em*3 + 8px);padding:4px 10px;margin:2px 0;text-align:center;background:#00000033;border-radius:10px;text-shadow:0 1px 2px #000}
.dk-log div:nth-last-child(n+3){opacity:.62}.dk-log div:nth-last-child(2){opacity:.82}
.dk-status{text-align:center;font-size:16px;font-weight:700;padding:3px 6px;min-height:26px;text-shadow:0 1px 2px #0009}
.dk-role{font-size:14px;font-weight:600;opacity:.95;text-align:center}
.dk-barb{display:flex;gap:10px;justify-content:center;align-items:center;min-height:48px}
.dk-barb button{min-height:48px;border:2px solid #cfe3a8;border-radius:var(--r);padding:8px 26px;font-size:17px;font-weight:800;color:#f4ffe0;background:linear-gradient(#5e8a2c,#3d6a1a);box-shadow:0 2px 0 #0006;cursor:pointer}
.dk-barb button.sec{background:linear-gradient(#8b5a2b,#5e3a18);border-color:#e0c9a0;color:#fff4dc}
.dk-me{display:flex;overflow-x:auto;justify-content:flex-start;padding:14px 4px 4px;min-height:calc(var(--cw)*1.55);touch-action:pan-x;scrollbar-width:none}
.dk-me::-webkit-scrollbar{display:none}
.dk-me::before,.dk-me::after{content:"";margin:auto}
.dk-me .card{margin-left:calc(var(--cw)*-.28)}
.dk-me .card:first-child{margin-left:0}
@media (orientation:portrait) and (max-height:760px){.dk-log,.dk-role{display:none}}
@media (orientation:landscape) and (max-height:560px){
  .dk-log,.dk-role{display:none}.dk-me{padding-top:8px}
  .dk{grid-template-columns:auto minmax(0,1fr);column-gap:12px;padding-top:2px;padding-bottom:4px}
  .dk-mid{display:contents}
  .dk-side{grid-column:1;grid-row:1/-1;justify-content:center;gap:8px}
  .dk-top,.dk-opps,#dk-table,.dk-bot,.dk-me{grid-column:2}
  .dk-bot{display:flex;align-items:center;justify-content:space-between;gap:10px}.dk-status{flex:1;text-align:left;padding:0 6px}
  .dk-top{min-height:44px;padding-top:0}
}
/* ================= PAC-MAN / ЗМЕЙКА ================= */
.s-pacman{--tone:#000}.s-snake{--tone:radial-gradient(ellipse at 50% 40%,#134a31,#0a2218 75%)}
.s-pacman canvas,.s-snake canvas{display:block;margin:0 auto}
.s-pacman .hud{color:#ffd800}
.s-snake .hud{color:#c8ff6a}
.cwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* ================= ПАСЬЯНСЫ ================= */
.s-klondike,.s-spider{--tone:radial-gradient(ellipse at 50% 30%,#13884a,#0b5a2e 70%)}
.s-spider{--tone:radial-gradient(ellipse at 50% 30%,#3a2a74,#1d1442 75%)}
.sbar2{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 8px;background:#0007;font-size:14px;flex-wrap:wrap}
.sbar2 .sp{flex:1;text-align:center;font-weight:700;white-space:nowrap;min-width:150px}
.sbar2 .bt{min-height:44px;min-width:44px;padding:0 10px;font-size:14px}
.sol-b{position:absolute;inset:0;scrollbar-width:none}.sol-b::-webkit-scrollbar{display:none}
.slot{position:absolute;border:2px dashed #ffffff4d;border-radius:8px;color:#ffffff80;display:flex;align-items:center;justify-content:center}
.sc{position:absolute;border-radius:8px;background:#fff;color:#111;box-shadow:0 1px 3px #0009;overflow:hidden;font-weight:700;touch-action:none}
.sc.r{color:#d11}
.sc .t{position:absolute;left:3px;top:1px;line-height:1;white-space:nowrap}
.sc .t2{position:absolute;right:3px;bottom:1px;line-height:1;transform:rotate(180deg);white-space:nowrap}
.sc .pp{position:absolute;left:10%;right:10%;top:25%;bottom:21%;display:block}.sc .pp svg{width:100%;height:100%;display:block}
.sc .c{position:absolute;left:0;right:0;bottom:2px;text-align:center;line-height:1;opacity:.9}
.sc.back{background:repeating-linear-gradient(45deg,#2540b8,#2540b8 5px,#4a64d8 5px,#4a64d8 10px);border:2px solid #fff}
.sc.hint{outline:3px solid var(--acc);box-shadow:0 0 14px 2px #ffcf3e;animation:hl .5s infinite alternate;z-index:900!important}
.slot.hint{border-color:var(--acc);box-shadow:0 0 14px 2px #ffcf3e;animation:hl .5s infinite alternate}
.sc.solin{animation:solin .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--dl,0s)}
@keyframes solin{from{transform:translate(var(--fx,0),var(--fy,0)) scale(.7);opacity:0}to{transform:none;opacity:1}}
.cnt{position:absolute;color:#fff;font-weight:700;text-align:center;pointer-events:none}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:14px;font-size:15px;z-index:60;pointer-events:none;max-width:92%;text-align:center}
/* ---- конфетти ---- */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:70}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:2px;opacity:0;animation:conf var(--t,2.4s) ease-in forwards;animation-delay:var(--d,0s)}
@keyframes conf{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--x,0),105vh,0) rotate(var(--rot,540deg));opacity:.9}}
/* ---- подсказка «поверните экран» ---- */
#rotate{position:fixed;inset:0;z-index:200;background:#0d1218f2;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:700}
body.tiny #rotate{display:flex}
/* ---- ландшафт: компактная шапка и табло ---- */
@media (orientation:landscape) and (max-height:560px){
  .bar{min-height:52px;padding:4px 10px}
  .hud{padding:2px 12px}.hbox{flex-direction:row;align-items:center;gap:8px}.hbox b{font-size:20px}.lives{min-height:24px}.lives .life{width:20px;height:20px}
  .sbar2{padding:2px 8px;flex-wrap:nowrap;overflow:hidden}.sbar2 .sp{min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .wrapm{padding-top:10px}.wrapm h1{font-size:26px;margin:2px 0}.wrapm .sub{margin-bottom:10px}
  .tile{min-height:96px;padding:10px 12px}.tile .ic{width:40px;height:40px;font-size:24px;margin-bottom:2px}
}
/* ---- уменьшение движения ---- */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.reduce *,body.reduce *::before,body.reduce *::after{animation:none!important;transition:none!important}
</style></head>
<body>
<div id="app">
<section class="screen" id="s-menu"><div class="wrapm">
 <h1>🎮 Игры</h1><div class="sub">Выбирайте игру. Всё сохраняется на этом устройстве.</div>
 <div class="tiles" id="tiles"></div>
 <div class="rowm"><a class="bt" href="#stats">📊 Статистика</a><button class="bt tg" id="m-snd"></button><button class="bt tg" id="m-vib"></button><button class="bt tg" id="m-dpad"></button></div>
</div></section>
<section class="screen" id="s-stats" hidden><div class="wrapm">
 <div class="rowm" style="margin:0 0 8px"><a class="bt" href="#menu">☰ Меню</a><button class="bt" id="st-reset">Сбросить всё</button></div>
 <h1>📊 Статистика</h1><div id="stlist"></div>
</div></section>
</div>
<div id="rotate">📱↻<br>Поверните экран — так игре не хватает места</div>
<script>
'use strict';
// ======================================================================
// ОБЩЕЕ: хранилище, настройки, звук, вибрация, статистика, экраны, роутер
// ======================================================================
const $ = (s, r) => (r || document).querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const Core = (() => {
  const P = 'gm_';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(P + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(P + k); } catch (e) {} },
  };
  const settings = Object.assign({ sound: true, vibe: true, dpad: false }, store.get('settings', {}));
  const saveSettings = () => store.set('settings', settings);

  // ---- Telegram (необязательно: работает, только если скрипт Telegram уже подключён клиентом)
  const tg = (window.Telegram && window.Telegram.WebApp) || null;
  try { if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); tg.setHeaderColor && tg.setHeaderColor('#0e1319'); tg.setBackgroundColor && tg.setBackgroundColor('#0e1319'); } } catch (e) {}

  // ---- вибрация
  function vibe(kind) {
    if (!settings.vibe) return;
    try {
      if (tg && tg.HapticFeedback) {
        if (kind === 'win') tg.HapticFeedback.notificationOccurred('success');
        else if (kind === 'lose') tg.HapticFeedback.notificationOccurred('error');
        else tg.HapticFeedback.impactOccurred(kind === 'hard' ? 'medium' : 'light');
      } else if (navigator.vibrate) navigator.vibrate(kind === 'win' ? [30, 40, 60] : kind === 'lose' ? [80, 40, 120] : kind === 'hard' ? 35 : 12);
    } catch (e) {}
  }

  // ---- звук (WebAudio, без файлов)
  let actx = null;
  function unlock() {
    try {
      if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, unlock, { passive: true }));
  function tone(f, d, type, vol, delay) {
    if (!actx) return;
    const t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || .08, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + .02);
  }
  const SFX = {
    click: () => tone(660, .05, 'square', .04),
    move: () => tone(420, .06, 'triangle', .07),
    flip: () => tone(520, .05, 'triangle', .05),
    err: () => tone(150, .12, 'sawtooth', .05),
    eat: () => tone(900, .05, 'square', .035),
    chomp: () => tone(240, .04, 'square', .03),
    power: () => { tone(300, .1, 'sawtooth', .05); tone(500, .1, 'sawtooth', .05, .09); },
    ghost: () => { tone(700, .08, 'square', .05); tone(1000, .1, 'square', .05, .07); },
    fruit: () => { tone(880, .07, 'triangle', .07); tone(1320, .09, 'triangle', .07, .07); },
    die: () => { for (let i = 0; i < 6; i++) tone(520 - i * 70, .13, 'sawtooth', .06, i * .1); },
    win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .08, i * .11)); },
    lose: () => { [400, 330, 262, 196].forEach((f, i) => tone(f, .2, 'triangle', .07, i * .14)); },
    deal: () => tone(380, .04, 'triangle', .05),
  };
  function sfx(n) { if (!settings.sound) return; unlock(); try { SFX[n] && SFX[n](); } catch (e) {} }

  // ---- статистика
  const stats = store.get('stats', {});
  const stat = (g, fn) => { const s = stats[g] || (stats[g] = {}); if (fn) { fn(s); store.set('stats', stats); } return s; };
  const fmtTime = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // ---- экран игры
  const ICO = {
    snd1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5H4z" fill="currentColor"/><path d="M16 8.6a4.8 4.8 0 0 1 0 6.8M18.8 6a8.6 8.6 0 0 1 0 12"/></svg>',
    snd0: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>',
    vib1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="17" rx="2" fill="currentColor" fill-opacity=".25"/><path d="M4.6 8v8M2 10v4M19.4 8v8M22 10v4"/></svg>',
    vib0: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M3 3l18 18"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15L19.5 12z"/></svg>',
  };
  function mkScreen(id, title, o) {
    o = o || {};
    const s = document.createElement('section');
    s.className = 'screen s-' + id; s.id = 's-' + id; s.hidden = true;
    s.innerHTML = `<header class="bar"><a class="ib menu nodot" href="#menu" title="В меню" aria-label="В меню">☰ Меню</a><b class="ttl">${title}</b><span class="sp"></span>${o.extra || ''}<button class="ib snd" data-a="snd"></button><button class="ib vib" data-a="vib"></button>${o.pause ? '<button class="ib pause nodot" data-a="pause" title="Пауза" aria-label="Пауза"></button>' : ''}</header>${o.mid || ''}<div class="stage"></div>`;
    $('#app').appendChild(s);
    const pb = $('[data-a="pause"]', s); if (pb) pb.innerHTML = ICO.pause;
    s.addEventListener('contextmenu', e => e.preventDefault());
    return { root: s, bar: $('.bar', s), stage: $('.stage', s), id };
  }
  // значок паузы в шапке: paused=true показывает «играть»
  function pauseIcon(root, paused) {
    const b = $('[data-a="pause"]', root); if (!b) return;
    b.innerHTML = paused ? ICO.play : ICO.pause; b.title = b.ariaLabel = paused ? 'Продолжить' : 'Пауза';
  }
  function paintToggles() {
    document.querySelectorAll('[data-a="snd"]').forEach(b => { b.innerHTML = settings.sound ? ICO.snd1 : ICO.snd0; b.classList.toggle('off', !settings.sound); b.title = b.ariaLabel = 'Звук: ' + (settings.sound ? 'включён. Нажмите, чтобы выключить' : 'выключен. Нажмите, чтобы включить'); });
    document.querySelectorAll('[data-a="vib"]').forEach(b => { b.innerHTML = settings.vibe ? ICO.vib1 : ICO.vib0; b.classList.toggle('off', !settings.vibe); b.title = b.ariaLabel = 'Вибрация: ' + (settings.vibe ? 'включена. Нажмите, чтобы выключить' : 'выключена. Нажмите, чтобы включить'); });
    const tg = (el, ico, name, on) => { if (!el) return; el.innerHTML = `<span>${ico} ${name}</span><i class="pill">${on ? 'вкл' : 'выкл'}</i>`; el.classList.toggle('off', !on); el.setAttribute('aria-pressed', on); };
    tg($('#m-snd'), settings.sound ? '🔊' : '🔇', 'Звук', settings.sound);
    tg($('#m-vib'), '📳', 'Вибрация', settings.vibe);
    tg($('#m-dpad'), '🕹', 'Кнопки', settings.dpad);
    document.querySelectorAll('.dpad').forEach(p => p.hidden = !settings.dpad);
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a="snd"],#m-snd,[data-a="vib"],#m-vib,#m-dpad'); if (!b) return;
    if (b.matches('[data-a="snd"],#m-snd')) { settings.sound = !settings.sound; if (settings.sound) { unlock(); sfx('click'); } }
    else if (b.matches('#m-dpad')) settings.dpad = !settings.dpad;
    else { settings.vibe = !settings.vibe; vibe('hard'); }
    saveSettings(); paintToggles();
  });

  // ---- панели поверх игры (старт / пауза / конец)
  function ov(stage) {
    const el = document.createElement('div'); el.className = 'ov'; el.hidden = true; stage.appendChild(el);
    return {
      el,
      show(o) {
        el.className = 'ov ' + (o.pos || 'top') + (o.dim ? ' dim' : '');
        el.innerHTML = `<div class="panel">${o.title ? `<h3>${o.title}</h3>` : ''}${o.html || ''}<div class="pb"></div></div>`;
        const pb = $('.pb', el);
        (o.btns || []).forEach(b => { const x = document.createElement('button'); x.className = 'pbtn ' + (b.cls || ''); x.textContent = b.t; x.onclick = () => { sfx('click'); b.fn(); }; pb.appendChild(x); });
        el.hidden = false; if (o.mount) o.mount(el);
      },
      hide() { el.hidden = true; el.innerHTML = ''; },
      get open() { return !el.hidden; },
    };
  }
  // переключатель вариантов внутри панели: opts = [{k,t}], cur, onpick
  function optRow(label, opts, cur, onpick) {
    const w = document.createElement('div');
    w.innerHTML = `<div class="opt" style="margin-bottom:0"><div class="lb">${label}</div></div><div class="opt"></div>`;
    const row = w.children[1];
    const paint = c => [...row.children].forEach(b => b.classList.toggle('on', String(b.dataset.k) === String(c)));
    opts.forEach(o => { const b = document.createElement('button'); b.dataset.k = o.k; b.textContent = o.t; b.onclick = () => { sfx('click'); onpick(o.k); paint(o.k); }; row.appendChild(b); });
    paint(cur); return w;
  }
  function dpad(stage, fn) {
    const d = document.createElement('div'); d.className = 'dpad'; d.hidden = !settings.dpad;
    [['u', '▲', 0], ['l', '◀', 1], ['r', '▶', 3], ['d', '▼', 2]].forEach(([c, t, k]) => {
      const b = document.createElement('button'); b.className = c; b.textContent = t;
      b.addEventListener('pointerdown', e => { e.preventDefault(); fn(k); }); d.appendChild(b);
    });
    stage.appendChild(d); return d;
  }
  // свайпы: возвращает функцию отписки; fn(dirIndex) где 0=вверх 1=влево 2=вниз 3=вправо
  function swipes(target, fn, thr, active) {
    let sx = null, sy = null;
    const st = (x, y) => { sx = x; sy = y; }, mv = (x, y) => {
      if (sx == null) return; const dx = x - sx, dy = y - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > thr) { fn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 1) : (dy > 0 ? 2 : 0)); sx = x; sy = y; }
    };
    const h = {
      touchstart: e => { if (active && !active()) return; const t = e.touches[0]; st(t.clientX, t.clientY); },
      touchmove: e => { if (active && !active()) return; if (e.cancelable) e.preventDefault(); const t = e.touches[0]; mv(t.clientX, t.clientY); },
      touchend: () => { sx = null; }, touchcancel: () => { sx = null; },
      mousedown: e => { if (active && !active()) return; st(e.clientX, e.clientY); },
      mousemove: e => { if (e.buttons) mv(e.clientX, e.clientY); },
      mouseup: () => { sx = null; },
    };
    Object.keys(h).forEach(k => target.addEventListener(k, h[k], { passive: k !== 'touchmove' }));
    return () => Object.keys(h).forEach(k => target.removeEventListener(k, h[k]));
  }
  // запрет жестов зума только на игровом поле
  document.addEventListener('gesturestart', e => { if (e.target.closest && e.target.closest('.board')) e.preventDefault(); });
  document.addEventListener('dblclick', e => { if (e.target.closest && e.target.closest('.board')) e.preventDefault(); });

  // ---- уменьшение движения, конфетти
  const rmq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  const reduceMotion = () => !!(rmq && rmq.matches);
  function confetti(host) {
    if (reduceMotion() || !host) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const cols = ['#ffcf3e', '#ef5350', '#4aa3ff', '#35d07f', '#a78bfa', '#ff8a3d'];
    for (let i = 0; i < 46; i++) {
      const p = document.createElement('i');
      p.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};--x:${(Math.random() - .5) * 160}px;--rot:${300 + Math.random() * 600}deg;--t:${1.8 + Math.random() * 1.4}s;--d:${Math.random() * .5}s`;
      box.appendChild(p);
    }
    host.appendChild(box); setTimeout(() => box.remove(), 4000);
  }
  // ---- размер окна: dvh/visualViewport, подсказка «поверните экран»
  function fitViewport() {
    const vv = window.visualViewport;
    let h = (tg && tg.viewportStableHeight) || (vv && vv.height) || innerHeight;
    h = Math.min(h, innerHeight + 1);
    document.documentElement.style.setProperty('--vh', Math.round(h) + 'px');
    document.body.classList.toggle('tiny', innerHeight < 250 && innerWidth > innerHeight);
  }
  addEventListener('resize', fitViewport); addEventListener('orientationchange', () => setTimeout(fitViewport, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
  if (tg && tg.onEvent) try { tg.onEvent('viewportChanged', fitViewport); } catch (e) {}
  fitViewport();
  // PWA: офлайн-кэш (работает при открытии по http/https)
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

  // ---- роутер игр
  const games = {}, order = [];
  let cur = null;
  function register(g) { games[g.id] = g; order.push(g.id); }
  function route() {
    let h = (location.hash || '#menu').slice(1);
    if (h !== 'menu' && h !== 'stats' && !games[h]) h = 'menu';
    if (cur === h) return;
    if (cur && games[cur]) { try { games[cur].leave(); } catch (e) { console.error(e); } }
    document.querySelectorAll('.screen').forEach(s => s.hidden = true);
    cur = h;
    const el = $('#s-' + h); if (el) el.hidden = false;
    if (h === 'menu') paintMenu(); else if (h === 'stats') paintStats();
    else { try { games[h].enter(); } catch (e) { console.error(e); } }
    document.title = h === 'menu' || h === 'stats' ? 'Игры' : games[h].title;
  }
  function paintMenu() {
    const t = $('#tiles'); t.innerHTML = '';
    order.forEach(id => {
      const g = games[id], a = document.createElement('a');
      a.className = 'tile'; a.href = '#' + id; a.style.background = g.color;
      a.innerHTML = `<span class="ic">${g.icon}</span><b>${g.title}</b><small>${g.info ? g.info() : ''}</small>${g.hasSave && g.hasSave() ? '<span class="cont">▶ продолжить</span>' : ''}`;
      t.appendChild(a);
    });
    paintToggles();
  }
  function paintStats() {
    const l = $('#stlist'); l.innerHTML = '';
    order.forEach(id => {
      const g = games[id], d = document.createElement('div'); d.className = 'card-s';
      d.innerHTML = `<h3>${g.icon} ${g.title}</h3>` + (g.statLines ? g.statLines().map(x => `<div>${x}</div>`).join('') : '');
      l.appendChild(d);
    });
  }
  $('#st-reset').onclick = () => { if (confirm('Сбросить всю статистику и рекорды?')) { Object.keys(stats).forEach(k => delete stats[k]); store.set('stats', stats); order.forEach(id => games[id].resetStats && games[id].resetStats()); paintStats(); } };
  addEventListener('hashchange', route);
  // автопауза при сворачивании
  const autoPause = () => { if (cur && games[cur] && games[cur].pause) { try { games[cur].pause(true); } catch (e) {} } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
  addEventListener('pagehide', () => { autoPause(); if (cur && games[cur] && games[cur].save) { try { games[cur].save(); } catch (e) {} } });
  document.addEventListener('freeze', autoPause);
  function start() {
    // старые адреса ?g=k / ?g=s
    const q = new URLSearchParams(location.search).get('g');
    if (q === 'k' || q === 's') { history.replaceState(null, '', location.pathname + '#' + (q === 'k' ? 'klondike' : 'spider')); }
    else if (q === 'd') history.replaceState(null, '', location.pathname + '#durak');
    paintToggles(); route();
  }
  return { store, settings, vibe, sfx, stat, stats, fmtTime, mkScreen, pauseIcon, ov, optRow, dpad, swipes, register, start, paintToggles, tg, confetti, reduce: () => reduceMotion(), setDpad(v) { settings.dpad = v; saveSettings(); paintToggles(); } };
})();
// ======================================================================
// ДУРАК: подкидной / переводной, 2–3 игрока, 3 уровня бота
// ======================================================================
const Durak = (() => {
  const SUITS = ['♠', '♥', '♦', '♣'];
  const RANKS = ['6', '7', '8', '9', '10', 'В', 'Д', 'К', 'Т'];
  const RED = s => s === '♥' || s === '♦';
  const NAMES = { me: 'Вы', bot: 'Бот', b1: 'Бот 1', b2: 'Бот 2' };
  const LVL = { 1: 'лёгкий', 2: 'средний', 3: 'сильный' };
  const scr = Core.mkScreen('durak', 'Дурак', { pause: true });
  const stage = scr.stage;
  stage.innerHTML = `<div class="dk">
    <div class="dk-top"><span id="dk-stat"></span><span style="display:flex;gap:8px"><button class="bt" id="dk-back" title="Сменить рубашку карт">🎴 Рубашка: <span id="dk-backname"></span></button> <button class="bt" id="dk-new">Новая игра</button></span></div>
    <div id="dk-opps" class="dk-opps"></div>
    <div class="dk-mid"><div class="dk-side"><div id="dk-deck"></div><div id="dk-trump"></div><div id="dk-disc"></div></div><div id="dk-table"></div></div>
    <div class="dk-bot"><div class="dk-log" id="dk-log"></div><div class="dk-role" id="dk-role"></div><div class="dk-status" id="dk-status"></div>
      <div class="dk-barb"><button id="dk-pass" style="display:none">Бито</button><button id="dk-take" class="sec" style="display:none">Беру</button></div></div>
    <div class="dk-me" id="dk-me"></div></div>`;
  const ov = Core.ov(stage);
  const $d = id => document.getElementById(id);

  let CFG = Core.store.get('durak_cfg', { n: 2, mode: 'pod', lvl: 2 });
  let PL = ['me', 'bot'];
  let sweepTo = null, S = null, busy = false, paused = false, gen = 0, active = false, shownMe = new Set(), dealAnim = false;
  const FAST = () => window.__durakFast === true;
  const AUTO_ME = () => window.__durakAuto === true;
  const isBot = p => p !== 'me' || AUTO_ME();
  const bsleep = async ms => { if (FAST()) return; await sleep(ms); };

  // ---------- колода и базовые правила ----------
  function newDeck() {
    const d = [];
    for (const s of SUITS) RANKS.forEach((r, i) => d.push({ s, r: i, id: s + i }));
    const rnd = n => { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; };
    for (let i = d.length - 1; i > 0; i--) { const j = rnd(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
    return d;
  }
  const isTrump = c => c.s === S.trump;
  const beats = (a, d) => (a.s === d.s && d.r > a.r) || (d.s === S.trump && a.s !== S.trump);
  const alive = () => PL.filter(p => !S.out.includes(p));
  function nextActive(p) {
    let i = PL.indexOf(p);
    for (let k = 0; k < PL.length; k++) { i = (i + 1) % PL.length; const q = PL[i]; if (q !== p && !S.out.includes(q)) return q; }
    return null;
  }
  function throwers() {
    const res = []; let i = PL.indexOf(S.attacker);
    for (let k = 0; k < PL.length; k++, i = (i + 1) % PL.length) { const q = PL[i]; if (q !== S.defender && !S.out.includes(q)) res.push(q); }
    return res;
  }
  const lg = t => { S.log.push(t); if (S.log.length > 8) S.log.shift(); };

  function startGame(cfg) {
    if (cfg) CFG = Object.assign({}, cfg);
    Core.store.set('durak_cfg', CFG);
    gen++; busy = false; paused = false; ov.hide();
    PL = CFG.n === 3 ? ['me', 'b1', 'b2'] : ['me', 'bot'];
    const deck = newDeck(), trumpCard = deck[0];
    S = { deck, trump: trumpCard.s, trumpCard, hands: {}, table: [], limit: 6, attacker: 'me', defender: 'bot', actor: 'me',
      passed: {}, phase: 'attack', selected: null, over: null, out: [], msg: '', cfg: Object.assign({}, CFG), discard: 0, gone: [], log: [], counted: false };
    PL.forEach(p => S.hands[p] = []);
    for (let i = 0; i < 6; i++) PL.forEach(p => S.hands[p].push(S.deck.pop()));
    const low = p => Math.min(99, ...S.hands[p].filter(isTrump).map(c => c.r));
    let best = 99, firsts = [];
    PL.forEach(p => { const l = low(p); if (l < best) { best = l; firsts = [p]; } else if (l === best) firsts.push(p); });
    S.attacker = firsts[Math.floor(Math.random() * firsts.length)];

    S.actor = S.attacker;
    S.msg = S.attacker === 'me' ? 'Вы ходите первым' + (best < 99 ? ' (младший козырь)' : '') : NAMES[S.attacker] + ' ходит первым';

  }

  function allowedAttack(c) {
    if (S.table.length >= S.limit) return false;
    if (!S.table.length) return true;
    return S.table.some(p => p.a.r === c.r || (p.d && p.d.r === c.r));
  }
  const undefended = () => S.table.filter(p => !p.d);
  const remove = (hand, c) => { const i = hand.findIndex(x => x.id === c.id); if (i >= 0) hand.splice(i, 1); };
  const cn = c => RANKS[c.r] + c.s;

  function canTransfer(p, c) {
    if (S.cfg.mode !== 'per' || S.phase !== 'defend' || S.defender !== p) return false;
    if (!S.table.length || S.table.some(x => x.d)) return false;

  }
  function doTransfer(p, c) {

    S.limit = Math.min(6, S.hands[nd].length);

  }
  function playAttack(p, c) {

  }
  function throwIn(p, c) { remove(S.hands[p], c); S.table.push({ a: c, d: null }); S.passed = {}; lg(NAMES[p] + ' подкидывает ' + cn(c)); Core.sfx('move'); setActor(); render(); }
  function playDefend(p, c, pair) {
    remove(S.hands[p], c); pair.d = c; S.selected = null;
    lg(NAMES[p] + ' бьёт ' + cn(pair.a) + ' → ' + cn(c)); Core.sfx('flip');
    if (!undefended().length) {

  }
  function pass(p) { S.passed[p] = true; setActor(); render(); }

  function setActor() {
    if (S.over) return;

    for (const p of throwers()) {

      else if (rest > 0) { if (nTable < 5 && !high && c.r >= 4 && many) return null; }                     // середина: старший козырь на мелочь — нет
      else if (L >= 3 && nTable < 4 && !high && c.r >= 5 && many) return null;                              // конец: старшие козыри берегём для финала

  function aiTransfer(p) {

    if (!cs[0]) return null;

  }

  async function tick() {

    try {
      let guard = 0;

        while (paused && my === gen) await sleep(120);
        if (my !== gen) break;
        const a = S.actor;

    statLines() { const s = Core.stat('snake'); return ['Игр: <b>' + (s.played || 0) + '</b>', 'Рекорд: ' + [1, 2, 3].map(k => SPEEDS[k].n + ' <b>' + (hiAll[k] || 0) + '</b>').join(' · '), 'Лучший уровень: <b>' + (s.maxLevel || 0) + '</b>']; },
    resetStats() { hiAll = { 1: 0, 2: 0, 3: 0 }; Core.store.del('snake_hi2'); Core.store.del('save_snake'); },
    enter() {
      active = true; paused = false; Core.pauseIcon(scr.root, false);
      size(); last = performance.now();
      if (state === 'idle' || state === 'over') { if (!restore()) reset(); }
      else if (state === 'play') { state = 'ready'; ov.show({ pos: 'top', title: '🐍 Змейка', html: '<div class="hint">Партия на паузе.</div>', btns: [{ t: '▶ Продолжить', cls: 'main', fn: begin }, { t: 'Заново', fn: reset }] }); }
      cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    },
    leave() { save(); active = false; cancelAnimationFrame(raf); ov.hide(); if (state === 'dying') finish(); },
    pause() { if (active && state === 'play' && !paused) togglePause(); },
    save,
  };
  Core.register(api);
  window.__snake = { get s() { return { state, score, snake, ROWS, level, paused, food, speed }; }, turn, setFood(x, y) { food = [x, y]; }, step };
  return api;
})();
Core.start();
</script>
